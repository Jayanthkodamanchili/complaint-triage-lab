[project]
name = "complaint-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jayanth Kodamanchili", email = "Jayanthkodamanchili@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.47,<6",
    "openai>=3.51.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
complaint-triage = "complaint_triage:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
